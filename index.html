<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture your thoughts, tasks and ideas in one place.</p>
  </header>

  <main>
    <!-- Add a note section -->
    <section>
      <h2>Add a note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note</label>
          <input
            type="text"
            id="note-input"
            placeholder="Write your note..."
          >
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>

      <p id="error-message"></p>
    </section>

    <!-- Your notes section -->
    <section>
      <h2>Your notes</h2>

      <label for="search-input">Search notes</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search your notes..."
      >

      <p id="note-count">You have no notes yet.</p>

      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
